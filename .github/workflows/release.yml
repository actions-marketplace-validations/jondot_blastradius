name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$crate" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $crate" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            triple="${{ matrix.target }}"
            upper=$(echo "${triple//-/_}" | tr '[:lower:]' '[:upper:]')
            export "CC_${triple//-/_}=musl-gcc"
            export "CARGO_TARGET_${upper}_LINKER=musl-gcc"
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/br
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          if [ "${{ matrix.musl }}" = "true" ]; then
            file "$bin" | grep -Eq 'statically linked|static-pie linked'
          fi

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="br-${version}-${{ matrix.target }}"
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path target/${{ matrix.target }}/release/br.exe -DestinationPath release/${name}.zip"
            archive="${name}.zip"
          else
            tar czf "release/${name}.tar.gz" -C "target/${{ matrix.target }}/release" br
            archive="${name}.tar.gz"
          fi
          cd release
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: br-${{ matrix.target }}
          path: release/*
          retention-days: 1

  release:
    name: Publish
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true

  npm:
    name: npm
    runs-on: ubuntu-24.04
    needs: release
    # set the repo variable NPM_PUBLISH=1 once the packages have npm trusted publishing for this workflow
    if: vars.NPM_PUBLISH == '1'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node npm/pack.mjs "$GITHUB_REF_NAME" dist out
      # the platform packages first, so `blastradius` never points at a version that is not there yet
      - run: |
          for dir in out/blastradius-*/ out/blastradius/; do
            npm publish "$dir" --provenance --access public
          done
