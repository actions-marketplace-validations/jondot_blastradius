[package]
name = "blastradius"
version = "0.1.0"
edition = "2021"
description = "Find where a bad package, action or file landed in your org, what it could reach, and who to tell"
license = "MIT"
repository = "https://github.com/jondot/blastradius"
homepage = "https://github.com/jondot/blastradius"
readme = "README.md"
keywords = ["supply-chain", "security", "incident-response", "sbom", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Ready for `cargo publish`, but the maintainer decides when: remove the next line (or set it to true) to publish.
publish = false
documentation = "https://github.com/jondot/blastradius/blob/main/docs/why.md"
# What goes into the crate: the sources, the embedded demo org, and the docs that the unit tests read.
include = ["/src/**", "/assets/demo/home.tar.gz", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/docs/why.md", "/docs/playbooks/**", "/docs/launch/**"]

[lib]
name = "blastradius"
path = "src/lib.rs"

[[bin]]
name = "br"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
fancy-regex = "0.16"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
base64 = "0.22"
toml = "0.8"
yara-x = { version = "1", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp"] }
dirs = "5"

[profile.release]
lto = "thin"
strip = true
